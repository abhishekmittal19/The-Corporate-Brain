        .material-symbols-outlined {

        }

            font-variation-settings: 'FILL' 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {

            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .bg-app {
            background-color: #d1dde8;
            position: relative;
            z-index: 0;
        }

        .bg-app::before {
            content: "";
            position: absolute;
            inset: -20px;
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1969&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            opacity: 0.35;
            z-index: -1;
            pointer-events: none;
        }

        #sidebar {
            width: 260px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-text {
            transition: opacity 0.2s, max-width 0.3s;
            white-space: nowrap;
            overflow: hidden;
            max-width: 200px;
            opacity: 1;
        }

        #sidebar.collapsed {
            width: 72px;
        }

        #sidebar.collapsed .sidebar-text {
            opacity: 0;
            max-width: 0;
            display: none;
        }

        #sidebar.collapsed #sidebar-logo,
        #sidebar.collapsed #fullscreenBtn {
            display: none;
        }

        #sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        #sidebar.collapsed .nav-item {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        #sidebar.collapsed .nav-item .material-symbols-outlined {
            margin-left: 0;
        }

        #sidebar.collapsed .sidebar-help-box {
            display: none;
        }

        @media (max-width: 767px) {
            #sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                width: 280px !important;
                max-width: 85vw;
                z-index: 50;
                transform: translateX(-100%);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            }

            #sidebar.mobile-open {
                transform: translateX(0);
            }
        }

        @media (min-width: 768px) {
            #sidebar {
                position: relative;
                transform: none !important;
            }
        }

        .raised-card {
            border-radius: 12px;
            box-shadow:
                inset 2px 2px 6px rgba(255, 255, 255, 0.4),
                inset -2px -2px 6px rgba(0, 0, 0, 0.1),
                0px 6px 12px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .raised-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.05) 100%);
            pointer-events: none;
        }

        .raised-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                inset 2px 2px 6px rgba(255, 255, 255, 0.6),
                inset -2px -2px 6px rgba(0, 0, 0, 0.05),
                0px 10px 18px rgba(0, 0, 0, 0.2);

        .raised-card:active {
            transform: translateY(1px) scale(0.98);
            box-shadow:

                inset -2px -2px 6px rgba(255, 255, 255, 0.3),

        .metric-card-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.08);
        }

            { id: 'pedia', label: 'Enterprise Pedia', icon: 'menu_book', bg: 'bg-[#90bbdb]', textColor: 'text-[#154669]' },
            { id: 'esg', label: 'ESG', icon: 'eco', bg: 'bg-[#90bbdb]', textColor: 'text-[#154669]' },
            { id: 'csr', label: 'CSR', icon: 'volunteer_activism', bg: 'bg-[#90bbdb]', textColor: 'text-[#154669]' },
            { id: 'annual-report', label: 'Annual Report', icon: 'description', bg: 'bg-[#90bbdb]', textColor: 'text-[#154669]' },
            { id: 'finances', label: 'Finances', icon: 'account_balance', bg: 'bg-[#90bbdb]', textColor: 'text-[#154669]' },

        // --- Sparkline Component ---
        function Sparkline({ points, color = '#3b82f6', width = 64, height = 32 }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !points || !points.length) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;

                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';

                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, width, height);

                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                const xStep = width / (points.length - 1);
                const yMax = Math.max(...points);
                const yMin = Math.min(...points);
                const yRange = yMax - yMin || 1;

                points.forEach((p, i) => {
                    const x = i * xStep;
                    const y = height - ((p - yMin) / yRange) * (height - 6) - 3;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, color + '33');
                grad.addColorStop(1, color + '00');
                ctx.fillStyle = grad;
                ctx.fill();
            }, [points, color, width, height]);

            return <canvas ref={canvasRef} className="absolute bottom-3 right-3" />;
        }

        // --- Document Access Chart Component ---
        function DocumentAccessChart() {
            const chartRef = useRef(null);

            useEffect(() => {
                const container = chartRef.current;
                if (!container || !window.echarts) return;

                const myChart = window.echarts.init(container);
                const option = {
                    baseOption: {
                        title: {
                            text: 'Document Type Access',
                            left: '0',
                            top: '0',
                            textStyle: {
                                color: '#202124',
                                fontSize: 18,
                                fontWeight: 600,
                            },
                        },
                        tooltip: {
                            trigger: 'item',
                            formatter: '{b}: {c}%',
                        },
                        color: ['#1f5a84', '#4d80a6', '#6a99b8', '#8db3cc', '#bed5e5', '#f3b985'],
                        series: [
                            {
                                name: 'Access',
                                type: 'pie',
                                radius: ['45%', '75%'],
                                center: ['50%', '55%'],
                                avoidLabelOverlap: true,
                                itemStyle: {
                                    borderColor: '#fff',
                                    borderWidth: 2,
                                },
                                label: {
                                    show: true,
                                    position: 'outside',
                                    formatter: '{name|{b}}\n{value|{c}%}',
                                    rich: {
                                        name: {
                                            fontSize: 13,
                                            color: '#333',
                                            fontWeight: 500,
                                            lineHeight: 18,
                                            align: 'center',
                                        },
                                        value: {
                                            fontSize: 13,
                                            color: '#666',
                                            align: 'center',
                                        },
                                    },
                                },
                                labelLine: {
                                    show: true,
                                    length: 18,
                                    length2: 22,
                                    lineStyle: {
                                        color: '#999',
                                        width: 1,
                                    },
                                },
                                data: [
                                    { value: 35, name: 'SOPs' },
                                    { value: 25, name: 'MoMs' },
                                    { value: 15, name: 'Manuals' },
                                    { value: 10, name: 'LMIs' },
                                    { value: 10, name: 'Feasibility' },
                                    { value: 5, name: 'Audits' },
                                ],
                            },
                        ],
                    },
                    media: [
                        {
                            query: { maxWidth: 480 },
                            option: {
                                title: { textStyle: { fontSize: 15 } },
                                series: [
                                    {
                                        radius: ['38%', '60%'],
                                        center: ['50%', '55%'],
                                        labelLine: { length: 8, length2: 10 },
                                        label: {
                                            rich: {
                                                name: { fontSize: 11, lineHeight: 14 },
                                                value: { fontSize: 11 },
                                            },
                                        },
                                    },
                                ],
                            },
                        },
                    ],
                };

                myChart.setOption(option);

                const handleResize = () => myChart.resize();
                window.addEventListener('resize', handleResize);

                let ro = null;
                if (window.ResizeObserver) {
                    ro = new ResizeObserver(() => myChart.resize());
                    ro.observe(container);
                }

                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (ro) ro.disconnect();
                    myChart.dispose();
                };
            }, []);

            return (
                <div className="col-span-12 lg:col-span-7 min-h-[300px] h-[320px] sm:h-[350px] lg:h-[35vh] bg-white p-3.5 sm:p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                    <div ref={chartRef} className="w-full flex-1 min-h-0" id="chart" />
                </div>
            );
        }

        // --- Main App Component ---
        function App() {
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);

            useEffect(() => {
                const handleFullscreenChange = () => {
                    setIsFullscreen(Boolean(document.fullscreenElement));
                };
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            const toggleFullscreen = useCallback(() => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.().catch(() => {});
                } else {
                    document.exitFullscreen?.().catch(() => {});
                }
            }, []);

            const handleToggleCollapse = useCallback(() => {
                if (window.innerWidth < 768) {
                    setMobileOpen((prev) => !prev);
                } else {
                    setSidebarCollapsed((prev) => !prev);
                }

            return (

                            </div>
                        </div>

                            type="button"
                            onClick={toggleFullscreen}
                            className="p-2 rounded-lg hover:bg-slate-100 text-slate-700 outline-none transition-colors"
                            aria-label="Toggle Fullscreen"
                        >
                            <span className="material-symbols-outlined fullscreen-icon text-2xl">
                                {isFullscreen ? 'fullscreen_exit' : 'fullscreen'}
                            </span>
                        </button>
                    </header>

                    {/* Mobile Backdrop */}

                        <div
                            onClick={() => setMobileOpen(false)}
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden transition-opacity"
                            aria-hidden="true"
                        />
                    )}

                    <div className="flex flex-row flex-1 min-h-0 overflow-hidden relative">

                        >
                            <div className="sidebar-header flex items-center px-4 gap-3 shrink-0 border-b h-16">
                                <button
                                    type="button"
                                    onClick={toggleFullscreen}
                                    className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors"
                                    aria-label="Toggle Fullscreen"
                                >
                                    <span className="material-symbols-outlined fullscreen-icon">
                                        {isFullscreen ? 'fullscreen_exit' : 'fullscreen'}
                                    </span>
                                </button>

                                <button

                                    Check our guide for advanced portal management tools.
                                </p>
                                <button

                        {/* Main Content Area */}

                                            {microToolCards.map((card) => {
